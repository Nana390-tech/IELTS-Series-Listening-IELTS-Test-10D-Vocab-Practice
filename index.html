<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Ready 10D</title>
<style>
:root{
  --ok:#2f8f6b; --ok-soft:#dcf1e7; --bad:#d9573f; --bad-soft:#fbe2dc; --amb:#b7791f; --amb-soft:#fdf3d8;
  --card:#fff; --ink:#1f2433; --muted:#5f6577; --line:#dde2ea; --r:16px;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:18px;line-height:1.6}
.ar{display:none;font-family:'Segoe UI',Tahoma,'Geeza Pro','Noto Sans Arabic',sans-serif;direction:rtl;text-align:right;color:var(--pri);font-size:.92em;line-height:1.8}
body.ar-on .ar{display:block}
button{font-family:inherit;cursor:pointer}
header{background:linear-gradient(120deg,var(--deep),var(--grad));color:#fff;padding:20px 18px 16px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-50px;top:-70px;width:220px;height:220px;border-radius:50%;background:var(--acc);opacity:.28}
.hw{max-width:980px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.kick{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;opacity:.9}
.kick span{background:var(--acc);color:#fff;border-radius:999px;padding:1px 9px;margin-left:6px;letter-spacing:.06em}
h1{margin:2px 0 0;font-size:1.7rem;line-height:1.2}
.sub{opacity:.85;font-size:.92rem}
.hb{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.hbtn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.32);border-radius:999px;padding:7px 13px;font-size:.88rem}
.hbtn:hover{background:rgba(255,255,255,.25)}
.hbtn.arb{font-weight:700;min-width:42px}
body.ar-on .hbtn.arb{background:var(--acc);border-color:var(--acc)}
.pts{background:#fff;color:var(--deep);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.92rem}
.sticky{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{max-width:980px;margin:0 auto;display:flex;gap:6px;padding:10px 14px;overflow-x:auto}
.tab{flex:1 0 auto;border:2px solid var(--line);background:#fff;color:var(--pri);border-radius:12px;padding:7px 12px;font-weight:600;font-size:.92rem;white-space:nowrap;position:relative}
.tab small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.tab.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tab.on small{color:#fff;opacity:.85}
.tab .done{position:absolute;top:-7px;right:-5px;background:var(--acc);color:#fff;border-radius:50%;width:20px;height:20px;font-size:.7rem;display:none;place-items:center}
.tab.fin .done{display:grid}
main{max-width:980px;margin:0 auto;padding:18px 14px 50px}
.sec{display:none}.sec.on{display:block;animation:f .3s}
@keyframes f{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
h2{margin:0 0 4px;color:var(--deep);font-size:1.4rem}
.intro{color:var(--muted);margin:0 0 12px}
.instr{border-left:5px solid var(--acc);background:#fff;padding:10px 14px;border-radius:0 12px 12px 0;margin-bottom:14px}
.btn{border:none;border-radius:12px;padding:11px 18px;font-weight:600;font-size:1rem}
.btn.main{background:var(--pri);color:#fff}.btn.main:hover{background:var(--deep)}
.btn.acc{background:var(--acc);color:#fff}
.btn.ghost{background:#fff;color:var(--pri);border:2px solid var(--pri)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* word bank */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fchip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;font-size:.88rem;color:var(--pri);font-weight:600}
.fchip.on{background:var(--pri-soft);border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.wc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;border-top:5px solid var(--pri)}
.wc.known{border-top-color:var(--ok)}
.wc .w{font-size:1.3rem;font-weight:700;color:var(--deep);display:flex;align-items:center;gap:8px}
.wc .pos{font-size:.75rem;color:var(--muted);font-style:italic}
.wc .arw{font-family:'Segoe UI',Tahoma,sans-serif;direction:rtl;color:var(--accDeep);font-size:1.05rem;font-weight:600;margin:2px 0}
.wc .def{font-size:.95rem}
.wc .ex{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:4px}
.wc .ex b{color:var(--pri);font-style:normal}
.say{border:none;background:var(--pri-soft);color:var(--pri);border-radius:50%;width:34px;height:34px;font-size:1rem;flex:none}
.say:hover{background:var(--pri);color:#fff}
.say.sm{width:28px;height:28px;font-size:.8rem}
.knowb{position:absolute;top:10px;right:10px;border:2px solid var(--line);background:#fff;border-radius:999px;font-size:.75rem;padding:2px 9px;color:var(--muted)}
.wc.known .knowb{background:var(--ok);border-color:var(--ok);color:#fff}
body.hide-mean .wc .arw,body.hide-mean .wc .def{filter:blur(6px);transition:filter .2s}
body.hide-mean .wc:hover .arw,body.hide-mean .wc:hover .def{filter:none}
/* spelling */
.sp{text-align:center;padding:26px 18px}
.sp .num{color:var(--muted);font-size:.9rem}
.sp .kind{display:inline-block;background:var(--acc-soft);color:var(--accDeep);border-radius:999px;padding:2px 12px;font-size:.82rem;font-weight:600;margin:6px 0 12px}
.bigplay{width:86px;height:86px;border-radius:50%;border:none;background:var(--pri);color:#fff;font-size:2rem;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.bigplay:hover{background:var(--deep)}
.spin{font:inherit;font-size:1.5rem;text-align:center;letter-spacing:.06em;padding:10px 14px;border:3px solid var(--line);border-radius:14px;width:min(380px,100%);margin:16px auto 8px;display:block}
.spin:focus{outline:none;border-color:var(--acc)}
.spin.ok{border-color:var(--ok);background:var(--ok-soft)}.spin.bad{border-color:var(--bad);background:var(--bad-soft)}
.diff{font-family:Consolas,'Courier New',monospace;font-size:1.5rem;letter-spacing:.12em;margin:8px 0}
.diff .l{display:inline-block;min-width:1ch;border-radius:4px;padding:0 1px}
.diff .m{color:var(--ok)}.diff .x{color:#fff;background:var(--bad)}.diff .miss{color:var(--amb);background:var(--amb-soft);text-decoration:underline}
.dlab{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.fb{border-radius:12px;padding:10px 14px;margin:10px auto;max-width:560px;text-align:left;font-size:.95rem}
.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}.fb.amb{background:var(--amb-soft)}
.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.cur{outline:3px solid var(--acc);outline-offset:1px}.dot.ok{background:var(--ok)}.dot.half{background:var(--amb)}.dot.bad{background:var(--bad)}
/* mcq */
.q{font-size:1.15rem;font-weight:500;margin-bottom:12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:9px}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-size:1.05rem;text-align:left;color:var(--ink)}
.opt:hover{border-color:var(--pri2)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
/* matching */
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.mi{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:1rem;color:var(--ink)}
.mi.sel{border-color:var(--acc);background:var(--acc-soft)}
.mi.done{border-color:var(--ok);background:var(--ok-soft);cursor:default}
.mi.done .tag{display:inline-block}
.mi .tag{display:none;background:var(--ok);color:#fff;border-radius:999px;font-size:.72rem;padding:0 7px;margin-right:6px}
.mi.wrong{animation:sh .4s;border-color:var(--bad)}
@keyframes sh{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mi .ar2{display:block;font-size:.85rem;color:var(--accDeep);direction:rtl;text-align:right}
/* results */
.big{font-size:2.4rem;font-weight:700;color:var(--deep)}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{border:2px dashed var(--line);border-radius:14px;padding:10px 14px;text-align:center;min-width:140px;color:var(--muted);font-size:.85rem}
.badge .e{font-size:1.8rem;display:block;filter:grayscale(1);opacity:.4}
.badge.got{border-style:solid;border-color:var(--acc);color:var(--deep);background:var(--acc-soft)}
.badge.got .e{filter:none;opacity:1}
.rev{border-left:4px solid var(--line);padding:6px 12px;margin:6px 0;font-size:.95rem}
.rev.ok{border-color:var(--ok)}.rev.bad{border-color:var(--bad)}
.cert{display:none;margin-top:14px;background:#fff;border:10px solid var(--deep);outline:3px solid var(--acc);outline-offset:-18px;padding:44px 26px;text-align:center}
.cert.on{display:block}
.cert .ck{letter-spacing:.22em;text-transform:uppercase;color:var(--accDeep);font-size:.82rem;font-weight:600}
.cert h3{font-size:1.9rem;margin:6px 0;color:var(--deep)}
.cert .nm{font-size:1.7rem;font-weight:600;color:var(--pri);border-bottom:2px solid var(--acc);display:inline-block;padding:0 24px 4px;margin:12px 0}
.cert .by{color:var(--muted);font-size:.88rem;margin-top:10px}
input.name{font:inherit;padding:10px 14px;border:2px solid var(--line);border-radius:12px;flex:1 1 220px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:10px 10px 30px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--deep);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:.3s;z-index:70;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:80}
.aloud{font-size:.88rem;display:inline-flex;align-items:center;gap:6px;background:var(--pri-soft);color:var(--pri);border-radius:999px;padding:3px 12px;cursor:pointer;font-weight:600}
.aloud small{font-weight:400;color:var(--muted)}
.warn{display:none;background:var(--amb-soft);border-radius:12px;padding:8px 12px;font-size:.9rem;margin-bottom:12px}
@media(max-width:640px){body{font-size:17px}h1{font-size:1.35rem}.mcols{grid-template-columns:1fr}.card{padding:15px 13px}}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:absolute;left:0;top:0;width:100%}}
</style>
</head>

 theme:{deep:'#3f1a45',pri:'#6b2d73',pri2:'#9257a0',priSoft:'#f1e6f3',acc:'#7fa82a',accDeep:'#4f6c12',accSoft:'#eef5dc',bg:'#f8f5f9',grad:'#8a3f94',conf:['#9bc53d','#6b2d73','#ffd166','#e68fd0','#c6e48b','#b79bd6']},

<script>
(function(){
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const KEY='word-ready-'+DATA.code.toLowerCase();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S;
function fresh(){return {pts:0,known:[],spell:{i:0,res:[],order:shuffle(DATA.spell.map((_,i)=>i))},mean:{i:0,res:[],qs:null},para:{done:[],miss:0,order:null},fin:{i:0,ans:[],qs:null,done:false},name:'',badges:[],aloud:false};}
S=fresh();

/* ---------- speech ---------- */
let VOICE=null;
function pickVoice(){const v=speechSynthesis.getVoices(); if(!v.length) return;
  const pref=['Google UK English Female','Microsoft Libby','Microsoft Sonia','Serena','Kate','Daniel','Google UK English Male','Microsoft Ryan','Microsoft Hazel','Microsoft George'];
  VOICE=pref.map(n=>v.find(x=>x.name.includes(n))).find(Boolean)||v.find(x=>/en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;}
if('speechSynthesis' in window){pickVoice(); speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text,rate=0.95){ if(!('speechSynthesis' in window)){toast('Your browser cannot read aloud. Try Chrome or Edge.');return;}
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); if(VOICE){u.voice=VOICE;u.lang=VOICE.lang;} else u.lang='en-GB'; u.rate=rate; speechSynthesis.speak(u);}
function sayItem(it,slow){
  if(it.t==='letters'){ const L=it.say.split(' '); speak(slow?L.join('.  '):L.join(', '), slow?0.7:1.0); }
  else speak(it.say, slow?0.6:0.95);
}

/* ---------- helpers ---------- */
function addPts(n){S.pts+=n; $('#pts').textContent='⭐ '+S.pts; const p=$('#pts'); p.animate([{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:350});}
function toast(m){const t=$('#toast');t.innerHTML=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2400);}
function confetti(){const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=DATA.theme.conf;
  const P=Array.from({length:160},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,w:6+Math.random()*7,h:8+Math.random()*8,c:cols[Math.random()*cols.length|0],vy:2+Math.random()*3.5,vx:-1.5+Math.random()*3,r:Math.random()*6,vr:-.2+Math.random()*.4}));
  let f=0;(function l(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();});if(++f<230)requestAnimationFrame(l);else x.clearRect(0,0,c.width,c.height);})();}
const normSp=s=>(s||'').toLowerCase().replace(/[£\s]/g,'').replace(/pounds?$/,'').replace(/[:]/g,'.').trim();
function spellOK(it,v){const n=normSp(v); return [it.a].concat(it.alt||[]).some(a=>normSp(a)===n);}
// letter diff (Levenshtein backtrace)
function diff(a,b){ // a = typed, b = correct
  a=a.toLowerCase(); b=b.toLowerCase(); const m=a.length,n=b.length,D=[];
  for(let i=0;i<=m;i++){D[i]=[i];}for(let j=0;j<=n;j++)D[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  let i=m,j=n; const typed=[],corr=[];
  while(i>0||j>0){
    if(i>0&&j>0&&D[i][j]===D[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){const same=a[i-1]===b[j-1];typed.unshift([a[i-1],same?'m':'x']);corr.unshift([b[j-1],same?'m':'miss']);i--;j--;}
    else if(i>0&&D[i][j]===D[i-1][j]+1){typed.unshift([a[i-1],'x']);i--;}
    else {corr.unshift([b[j-1],'miss']);j--;}
  }
  const r=arr=>arr.map(([c,k])=>`<span class="l ${k}">${c===' '?'&nbsp;':esc(c)}</span>`).join('');
  return {typed:r(typed),corr:r(corr)};
}
function wordsLike(target,pool,n){ // distractors of similar length, not longer pattern
  const others=pool.filter(w=>w!==target);
  return shuffle(others).sort((x,y)=>Math.abs(x.length-target.length)-Math.abs(y.length-target.length)).slice(0,n*2).sort(()=>Math.random()-.5).slice(0,n);
}

/* ---------- 5 final check ---------- */
function buildFin(){
  const pool=DATA.words.map(w=>w.w), qs=[];
  shuffle(DATA.spell.map((_,i)=>i)).slice(0,8).forEach(i=>qs.push({k:'sp',i}));
  shuffle(DATA.words.map((_,i)=>i)).slice(0,6).forEach(i=>{const w=DATA.words[i]; const sent=w.ex.replace(new RegExp(w.w.split(' ')[0].slice(0,Math.max(3,w.w.length-3))+'[a-z\\-]*( of)?','i'),'_____');
    qs.push(sent.includes('_____')?{k:'gap',i,sent,opts:shuffle([w.w].concat(wordsLike(w.w,pool,3)))}:{k:'mn',i,opts:shuffle([w.w].concat(wordsLike(w.w,pool,3)))});});
  shuffle(DATA.para.map((_,i)=>i)).slice(0,6).forEach(i=>{const others=shuffle(DATA.para.map((_,k)=>k).filter(k=>k!==i)).slice(0,3); qs.push({k:'pa',i,opts:shuffle([i].concat(others))});});
  return shuffle(qs);
}
function rFin(){
  const f=S.fin; if(!f.qs) f.qs=buildFin();
  if(f.done) return finResults();
  if(f.i>=f.qs.length){ f.done=true; marks(); return finResults(); }
  const q=f.qs[f.i]; let body='';
  if(q.k==='sp'){const it=DATA.spell[q.i]; body=`<div class="q">🎧 Listen and write what you hear.</div><div class="row" style="justify-content:center"><button class="bigplay" id="fPl">▶</button><button class="say" id="fSl" style="width:52px;height:52px;font-size:1.4rem">🐢</button></div><input class="spin" id="fIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type here"><div class="row" style="justify-content:center"><button class="btn acc" id="fOk">Save & next →</button></div>`;}
  else if(q.k==='gap'){const w=DATA.words[q.i]; body=`<div class="q">Complete the sentence:<br><span style="font-size:1.2rem">“${esc(q.sent)}”</span></div><div class="opts">${q.opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;}
  else if(q.k==='mn'){const w=DATA.words[q.i]; body=`<div class="q">Which word means: “${esc(w.def)}”?</div><div class="opts">${q.opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;}
  else {const p=DATA.para[q.i]; body=`<div class="q">The question says <b>“${esc(p.q)}”</b>.<br>What might you hear in the recording?</div><div class="opts">${q.opts.map(o=>`<button class="opt" data-o="${o}">${esc(DATA.para[o].h)}</button>`).join('')}</div>`;}
  $('#s-fin').innerHTML=`<h2>Final Check</h2><p class="intro">20 mixed questions. No feedback until the end. Score <b>16 or more</b> to earn your certificate.</p>
   <div class="instr">Question ${f.i+1} of ${f.qs.length}<div class="ar">20 سؤالًا متنوعًا. ستظهر النتائج في النهاية. احصل على 16 أو أكثر لتنال الشهادة.</div></div><div class="card sp">${body}</div>
   <div class="dots">${f.qs.map((_,k)=>`<span class="dot ${k<f.i?'ok':k===f.i?'cur':''}"></span>`).join('')}</div>`;
  const next=v=>{f.ans[f.i]=v; f.i++; rFin();};
  if(q.k==='sp'){const it=DATA.spell[q.i]; $('#fPl').onclick=()=>sayItem(it,false); $('#fSl').onclick=()=>sayItem(it,true); $('#fOk').onclick=()=>{const v=$('#fIn').value.trim(); if(!v){toast('Type your answer first.');return;} next(v);}; $('#fIn').onkeydown=e=>{if(e.key==='Enter')$('#fOk').click();}; setTimeout(()=>{const fi=$('#fIn'); if(fi){fi.focus(); sayItem(it,false);}},300);}
  else $$('#s-fin .opt').forEach(b=>b.onclick=()=>next(b.dataset.o));
}
function finCorrect(q,a){ if(q.k==='sp') return spellOK(DATA.spell[q.i],a); if(q.k==='pa') return +a===q.i; return a===DATA.words[q.i].w; }
function finResults(){
  const f=S.fin, sc=f.qs.reduce((t,q,k)=>t+(finCorrect(q,f.ans[k])?1:0),0), pass=sc>=16;
  if(!f.scored){f.scored=true; addPts(sc*5); if(pass) badge('fin','Ready to Listen');}
  const rev=f.qs.map((q,k)=>{const ok=finCorrect(q,f.ans[k]); let t,a;
    if(q.k==='sp'){t='🎧 Spelling';a=DATA.spell[q.i].a;} else if(q.k==='pa'){t='“'+DATA.para[q.i].q+'”';a=DATA.para[q.i].h;} else {t=q.k==='gap'?esc(q.sent):'“'+esc(DATA.words[q.i].def)+'”';a=DATA.words[q.i].w;}
    const yours=q.k==='pa'?DATA.para[+f.ans[k]].h:f.ans[k];
    return `<div class="rev ${ok?'ok':'bad'}">${ok?'✓':'✗'} ${t} — ${ok?`<b>${esc(a)}</b>`:`you: <s>${esc(yours)}</s> · answer: <b>${esc(a)}</b>`}</div>`;}).join('');
  const B=[['spell','✍️','Super Speller','80% in Spell It'],['mean','📖','Word Master','80% in Meanings'],['para','🔁','Paraphrase Pro','Same Meaning with ≤2 mistakes'],['fin','🎧','Ready to Listen','16+ in Final Check']];
  $('#s-fin').innerHTML=`<h2>Final Check — results</h2>
   <div class="card" style="text-align:center"><div class="big">${sc} / 20</div><p>${pass?'Great — you are ready for '+DATA.pairs+'!':'Almost there. Review the words you missed, then try a new Final Check.'}</p>
   <div class="row" style="justify-content:center"><button class="btn ghost" id="fAgain">↺ New Final Check</button></div></div>
   <div class="card"><b>Badges</b><div class="badges" style="margin-top:8px">${B.map(([id,e,n,d])=>`<div class="badge ${S.badges.includes(id)?'got':''}"><span class="e">${e}</span><b>${n}</b><br>${d}</div>`).join('')}</div></div>
   <div class="card"><b>Certificate</b>${pass?`<div class="row" style="margin-top:8px"><input class="name" id="cN" placeholder="Your full name" value="${esc(S.name)}"><button class="btn acc" id="cMk">Create certificate</button><button class="btn ghost" id="cPr">🖨 Print / PDF</button></div>`:`<p>Score 16 or more in the Final Check to unlock your certificate.</p>`}
   <div class="cert" id="cert"><div class="ck">Pre-listening review · ${DATA.code}</div><h3>Certificate of Achievement</h3><div>This certifies that</div><div class="nm" id="cNm"></div><div>completed <b>${DATA.title}</b> with <b>${sc} / 20</b> in the Final Check<br>and is ready for ${DATA.pairs}.</div><div class="by" id="cDt"></div><div class="by">Designed by: Nazila Motahari</div></div></div>
   <div class="card"><b>Review your answers</b>${rev}</div>`;
  $('#fAgain').onclick=()=>{S.fin={i:0,ans:[],qs:null,done:false};marks();rFin();};
  if(pass){ const mk=()=>{S.name=$('#cN').value.trim(); if(!S.name){toast('Please type your name.');return false;} $('#cNm').textContent=S.name; $('#cDt').textContent=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}); $('#cert').classList.add('on'); return true;};
    $('#cMk').onclick=()=>{if(mk()){confetti(); $('#cert').scrollIntoView({behavior:'smooth',block:'center'});}}; $('#cPr').onclick=()=>{if(mk()) setTimeout(()=>print(),300);}; if(S.name) mk(); }
}

/* ---------- events & save ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.tab) return go(b.dataset.tab);
  if(b.dataset.go) return go(b.dataset.go);
  if(b.dataset.f!==undefined){filt=+b.dataset.f; return rBank();}
  if(b.dataset.sw) return speak(DATA.words[+b.dataset.sw].w,0.85);
  if(b.dataset.se) return speak(DATA.words[+b.dataset.se].ex,0.9);
  if(b.dataset.k!==undefined){const k=+b.dataset.k; if(S.known.includes(k)) S.known=S.known.filter(x=>x!==k); else {S.known.push(k); addPts(1);} if(S.known.length===DATA.words.length) badge('bank','Word Collector'); rBank(); marks();}
});
$('#arB').onclick=()=>document.body.classList.toggle('ar-on');
$('#svB').onclick=()=>{const blob=new Blob([JSON.stringify({app:KEY,saved:new Date().toISOString(),...S})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${DATA.title.replace(/\s+/g,'-')}-${(S.name||'progress').replace(/\s+/g,'-')}.json`;a.click();toast('Progress saved to a file.');};
$('#ldB').onclick=()=>$('#ldF').click();
$('#ldF').onchange=e=>{const fl=e.target.files[0]; if(!fl) return; const r=new FileReader(); r.onload=()=>{try{const o=JSON.parse(r.result); if(o.app!==KEY){toast('This file is from a different app.');return;} S=Object.assign(fresh(),o); marks(); go(o.tab||'bank'); toast('Progress loaded.');}catch(err){toast('Could not read that file.');}}; r.readAsText(fl); e.target.value='';};
$('#rsB').onclick=()=>{if(confirm('Start again and clear all progress?')){S=fresh(); marks(); go('bank');}};

shell(); marks(); go('bank');
window.__W={get S(){return S},spellOK,diff,finCorrect};
})();

</script>
